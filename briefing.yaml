# 아침 브리핑 설정 (briefing.py 가 읽는다)
# config.yaml 과 따로 둔다: 웹의 '감시 대상 관리'가 config.yaml 을 다시 쓸 때 이 설정이 섞이지 않게.

# 날씨 지역. 복학 후 국제캠퍼스로 바꿀 때는 아래 주석 줄과 바꾼다.
weather:
  name: 광명시
  lat: 37.4786
  lon: 126.8645
# weather:
#   name: 경희대 국제캠퍼스 (용인 기흥)
#   lat: 37.2393
#   lon: 127.0833

# 뉴스 모으는 시간: 전날 이 시각부터 브리핑을 만드는 시각까지 (한국 시간)
news_since: "18:00"
per_category: 6          # 분야별 최대 기사 수
delay_seconds: 2         # 피드 사이 대기 (줄이지 않는다)

# 분야별 RSS. include 가 있으면 제목에 그 단어가 하나라도 든 기사만, exclude 가 있으면 그 단어가 든 기사는 뺀다.
# 모두 robots.txt 허용 확인 (2026-11-07). 구글 뉴스는 robots.txt 가 막아서 쓰지 않는다.
categories:
  - name: 주요 뉴스
    feeds:
      - source: 연합뉴스
        url: "https://www.yna.co.kr/rss/news.xml"
        exclude: ["[인사]", "[부고]", "[게시판]", "[포토]", "[사진]", "[표]", "[그래픽]", "[오늘의 운세]", "[날씨]", "[영상]"]
  - name: 건설·부동산
    feeds:
      - {source: 한국경제 부동산, url: "https://www.hankyung.com/feed/realestate"}
      - source: 연합뉴스 산업
        url: "https://www.yna.co.kr/rss/industry.xml"
        include: [건설, 시공, 수주, 분양, 재건축, 재개발, 국토부, 국토교통, 주택, 아파트, 부동산, 공사비, 건축, 토목, 모듈러, 스마트건설, 현대건설, 삼성물산, 대우건설, GS건설, DL이앤씨]
      - source: 연합뉴스
        url: "https://www.yna.co.kr/rss/news.xml"
        include: [건설, 시공, 수주, 분양, 재건축, 재개발, 국토부, 국토교통, 주택, 아파트, 부동산, 공사비, 붕괴, 건축, 토목]
  - name: IT·AI
    feeds:
      - {source: 한국경제 IT, url: "https://www.hankyung.com/feed/it"}
      - {source: 전자신문 AI·SW, url: "https://rss.etnews.com/04.xml"}
  - name: 경제·증시
    feeds:
      - {source: 연합뉴스 경제, url: "https://www.yna.co.kr/rss/economy.xml"}
      - {source: 연합뉴스 마켓, url: "https://www.yna.co.kr/rss/market.xml"}
      - {source: 한국경제 증권, url: "https://www.hankyung.com/feed/finance"}

# 오늘 일정: schedule.json + 학사 공지 기간 (공지 사이트 '일정' 탭과 같은 자료)
upcoming_days: 7         # 오늘 일정 아래에 '다가오는 일정'을 며칠 앞까지 보여줄지

# ANTHROPIC_API_KEY 비밀값이 있으면 헤드라인만 보고 '밤사이 핵심' 3~5줄을 만든다. 없으면 건너뛴다.
ai_summary: true
