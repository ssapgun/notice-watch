# 공지·입시 감시 설정 파일
# 대시보드의 '감시 대상 관리' 화면에서 추가·수정·삭제하면 이 파일이 자동으로 다시 쓰인다.
# 직접 고쳐도 되지만, 화면에서 저장하면 이 파일의 주석은 이 머리말만 남는다. 설명은 각 대상의 note 칸에 적는다.
# 저장할 때마다 바로 이전 내용이 config.yaml.bak 에 남는다.
delay_seconds: 2
auto_check_hours: 6
max_age_months: 8
max_age_months_by_group:
  경희대: 3
max_pages: 25
summary:
  enabled: true
  model: claude-haiku-5-5
  per_run: 150
highlight:
  keywords:
  - 구조
  - BIM
  - OSC
  - 모듈러
  - 강구조
  - 철골
  - 접합
  - 탈현장
  - 프리캐스트
  - 자동화
  - 학부연구생
  - 연구생
  - T/O
  - T.O
  - 장학생 모집
  - 연구실탐방
  - 연구실 탐방
  - 대학원 모집
  - 모집요강
  - 신(편)입학
  - Modular
  - Steel
  - 構造
  - 鋼構造
  - 공모전
  - 경진대회
  - 해커톤
  - 부트캠프
  - 현장실습
  exclude:
  - 구조조정
  - 조직구조
  - 조직 구조
  - 인명구조
  - 구조대
  - 구조요청
  - 구조 요청
  - 가족구조
  alert:
  - 학부연구생
  - T/O
  - T.O
  - 모집요강
  - 연구실탐방
  - 연구실 탐방
  - 대학원 모집
  - 신(편)입학
  - 장학생 모집
  - 모듈러
  - 강구조
  - 철골
  - 募集要項
  - BIM AWARDS
  - 엔지니어링산업 경진대회
  - 스마트건설 챌린지
site_url: https://ssapgun.github.io/notice-watch/
exams:
- name: 건축기사 (2027 정기)
  category: 국가기술자격
  status: 미발표
  url: https://www.q-net.or.kr/rcv001.do?gSite=Q.&id=rcv00104
  note: 2027년 시행계획 발표 전. 참고로 2026년 필기 원서접수는 1회 1/12~1/15, 2회 4/20~4/23, 3회 7/20~7/23. 응시자격은 큐넷 응시자격 자가진단으로 먼저 확인할 것. 2027 시행계획이 큐넷 첫 화면에 올라오면 공지보기 '자격증'에서 알린다.
- name: JLPT N3 (2027 제1회)
  category: 어학 · 일본어
  status: 미발표
  url: https://www.jlpt.or.kr
  note: N4 다음 단계. 2027년 7월 회차 접수 일정이 나오면 추가.
- name: TOEFL iBT
  category: 어학 · 영어
  status: 상시
  url: https://www.ets.org/toefl.html
  note: 원하는 날짜를 골라 접수. 2026년 1월 시험 개편. 기관토플과 둘 중 하나. 응시일을 정하면 일정에 추가.
- name: OPIc
  category: 어학 · 영어 말하기
  status: 상시
  url: https://www.opic.or.kr
  note: 거의 매일 시행. 2~3주 전 좌석 예약 권장, 재응시는 25일 뒤부터, 결과는 응시 10일 뒤 13시. 경희대 재학·휴학생 연 2회 69,000원 할인. 토익스피킹과 둘 중 하나.
- name: 토익스피킹
  category: 어학 · 영어 말하기
  status: 미정
  url: https://exam.toeic.co.kr
  note: 시험 일정은 확인하지 않았다. GPMU 스터디 일정에 맞춰 응시일을 정하면 추가. OPIc 과 둘 중 하나.
- name: CAPM (PMI)
  category: PM 자격
  status: 미정
  url: https://www.pmi.org/certifications/certified-associate-capm
  note: '요건: 고졸 이상·만 18세 이상·프로젝트관리 교육 23시간. 180분 150문항. GPMU 수강 시간이 23시간으로 인정되는지 확인할 것.'
- name: 엔지니어링산업 경진대회 – BIM·설계 아이디어 (한국엔지니어링협회)
  category: 공모전
  status: 미발표
  url: https://thinkyou.co.kr/contest/61359
  note: 'BIM 부문 장려상을 받았던 대회. 2026년 기준 BIM: 신청 3/3~4/30, 작품 5/1~7/17 (이공계 전문대 이상 재학·휴학생 또는 미취업 졸업생, 2~4인). 설계 아이디어: 신청 3/3~4/10, 작품 4/13~5/15. BIM 상금 대상 500만 원~장려 100만 원. 2027년 공고는 3월 무렵 예상.'
- name: BIM AWARDS 2027 (빌딩스마트협회)
  category: 공모전
  status: 미발표
  url: https://www.theteams.kr/activities/page/331951/lc
  note: 대학생 부문(휴학생 가능, 4인 이하 팀). 2026년 접수 6/22~9/4.
- name: 스마트건설 창업 아이디어 공모전 (한국건설기술연구원)
  category: 공모전
  status: 미발표
  url: https://www.unicornfactory.co.kr/article/2026032308101327632
  note: 2026년 접수 3/23~5/1. 예비창업자 포함 5인 이하 팀, AI·BIM·OSC·건설로봇 분야, 총상금 4,500만 원. 학생 참가 가능 여부는 공고 원문 확인.
- name: 스마트건설 챌린지 (국토교통부)
  category: 공모전
  status: 미발표
  url: https://www.heraldk.com/article/2026061413000075036
  note: 2026년 접수 6월~7/14. 기업·기관·개인 누구나. 총상금 3억 원.
- name: 대학생 모듈러 건축설계 공모전 (대한건축학회)
  category: 공모전
  status: 미발표
  url: https://www.aik.or.kr/board/?ncode=a001
  note: 2026년 제1회 개최. 다음 회차 공지는 '학회' 분류(대한건축학회 학회소식)에서 잡힌다.
- name: 경희대 일반대학원 방학 학부연구생
  category: 방학 프로그램
  status: 복학 후
  url: https://gskh.khu.ac.kr/gskh_kor/user/bbs/BMSR00040/view.do?menuNo=13100089&boardId=555695
  note: 정규학기 재학생, 4개 학기 이상 등록(편입생 가능), 직전 학기 2.0 이상·12학점 이상, 학과·연구실 탐방 후 교수 추천. 이번 동계는 12/21~2/5(휴학 중이라 불가). 공고는 '일반대학원' 소분류에서 잡힌다.
- name: 경희대 겨울·여름학기 단기현장실습
  category: 방학 프로그램
  status: 복학 후
  url: https://www.khu.ac.kr/kor/user/bbs/BMSR00040/view.do?menuNo=200316&boardId=323286
  note: 방학 중 기업 현장실습 + 학점 인정. 세부 조건은 현장실습 사이트(intern.khu.ac.kr) 확인. 공고는 학교·공과대학·건축공학과 공지에서 잡힌다.
- name: 경희대 동계·하계 국제화연수
  category: 방학 프로그램
  status: 복학 후
  url: https://www.khu.ac.kr/kor/user/bbs/BMSR00040/view.do?menuNo=200316&boardId=323300
  note: '재학생 대상. 예: 2026 동계 SDGs(Lincoln University) 학생 부담 약 150만 원+항공비, 10/25 마감.'
- name: LG 에이머스 (AI 온라인 교육 + 해커톤)
  category: 방학 프로그램
  status: 미발표
  url: https://www.lg.co.kr/media/release/30586
  note: 만 19~29세, 연 2회. 해커톤은 8기 4월·9기 9월. 다음 기수 모집 날짜는 미확인.
- name: 현대차그룹 소프티어 부트캠프
  category: 방학 프로그램
  status: 대상 아님
  url: https://www.smarttoday.co.kr/ko-kr/articles/112841
  note: 9기 12/28~2/26(8주, 겨울방학형). 대상이 2026.8~2027.8 졸업(예정)자라 지금은 해당 없음. 졸업예정 학년에 다시 확인.
- name: 구글 머신러닝 부트캠프
  category: 방학 프로그램
  status: 미발표
  url: https://blog.google/intl/ko-kr/company-news/technology/the-global-machine-learning-training-program-born-out-of-south-korea/
  note: 과정은 있으나 모집 시기·대상은 확인하지 못했다.
- name: 차세대 건설리더 아카데미 24기 (한미글로벌·서울대)
  category: 교육 프로그램
  status: 미발표
  url: http://www.ncla.co.kr/
  note: 건설 관련 학과 대학(원)생·졸업생 대상, 50명 내외. 23기는 2026.5.8 발표·5/22 마감, 6/22~7/24(온라인 4주+서울대 1주). 우수 수료생 한미글로벌 신입 채용 서류 면제. 공지보기 '부트캠프·교육'에서 공지 게시판을 감시한다.
- name: 현대건설 기술교육원 건설실무 교육 체험 데이
  category: 교육 프로그램
  status: 미발표
  url: https://edu.hdec.co.kr/
  note: 청년 구직자 대상 교육과정·직무 체험과 1:1 진로 멘토링. 2026년은 8/28 영등포 기술교육원, 8/23까지 홈페이지 신청. 교육원 홈페이지는 자바스크립트라 직접 감시하지 못하고, 공지보기 '부트캠프·교육'의 콘테스트코리아·링커리어 게시판에서 잡는다.
- name: KSCE 2027 CONVENTION (대한토목학회)
  category: 학술대회
  status: 미발표
  url: https://www.ksce.or.kr/
  note: 매년 10월. 2026년은 10/21~23 정선 하이원리조트(52회). 공지보기 '학회'의 대한토목학회 게시판에서 잡힌다.
- name: 한국지반공학회 2027 봄 학술발표회
  category: 학술대회
  status: 미발표
  url: https://conference.kgshome.org/
  note: 기초·지반 분야. 2026년은 봄 3/26~27(서울 과학기술컨벤션센터), 가을 9/17~18(소노캄 델피노).
- name: SEWC 2027 (제10회 Structural Engineers World Congress)
  category: 학술대회
  status: 미정
  url: https://www.ksce.or.kr/not/default.asp?gbn=10&htop=MN0031&ctop=MN0096
  note: 국제 구조공학 학술대회. 대한토목학회 대외기관 게시판 2026-11-05 안내. 개최 날짜·장소는 아직 확인하지 않았다.
- name: 건설사업관리사(CMP) 자격검정 (한국CM협회)
  category: CM·PM 자격
  status: 미발표
  url: https://www.cmak.or.kr/business/inspection
  note: CM/PM 경력직 진로용 민간자격(등록번호 2008-0397, 국가공인 아님). 2026년 제1회는 1차 필기 합격 9/14, 2차 필기 합격·면접 10/26 공고. 응시자격(경력 요건)은 확인하지 않았다. 공지보기 '자격증'·'공모전'의 한국CM협회에서 잡힌다.
- name: 제21회 건설사업관리(CM) 표어 온라인 공모전 (한국CM협회)
  category: 공모전
  status: 접수 중
  url: https://www.cmak.or.kr/board/news_association/11552
  note: 접수 2026.10.12~11.13, 발표 11/30. 대상 제한 없음, CM 질 향상 주제 20자 이내 1인 3개. 최우수 상품권 20만 원.
- name: 전국 대학생 CM·시공 경진대회 (무영CM)
  category: 공모전
  status: 미발표
  url: https://linkareer.com/activity/355326
  note: 한국CM협회·한국건설관리학회와 함께 열린 적 있는 대학생 CM 대회. 2026년 제11회 결선 8/11~12(1박 2일). 다음 회차 공고 미발표.
- name: LH 국토기술대전 (대학·대학원생)
  category: 공모전
  status: 미발표
  url: https://www.smarttoday.co.kr/ko-kr/articles/110267
  note: 매년 여름. 2026년 제17회는 7월 말~8월 말 접수, 주제 환경·재해안전·AI·ESG·스마트건설기술, 전공 제한 없음(휴학생 가능).
- name: LH 청년 주택건축대전
  category: 공모전
  status: 미발표
  url: https://www.heraldk.com/article/2026061715225076774
  note: 매년 6~7월. 2026년 제30회 7/3 마감, 설계 주제 '생태 공존 청년 주거'. 수상자 LH 입사 인센티브. 과거 아이디어 부문도 있었다.
