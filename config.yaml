- name: OPIc
  category: 어학 · 영어 말하기
  status: 상시
  url: https://www.opic.or.kr
  note: 거의 매일 시행. 2~3주 전 좌석 예약 권장, 재응시는 25일 뒤부터, 결과는 응시 10일 뒤 13시. 경희대 재학·휴학생 연 2회 69,000원 할인. 토익스피킹과 둘 중 하나.
