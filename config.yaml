# 공지·입시 감시 설정 파일
# 대시보드의 '감시 대상 관리' 화면에서 추가·수정·삭제하면 이 파일이 자동으로 다시 쓰인다.
# 직접 고쳐도 되지만, 화면에서 저장하면 이 파일의 주석은 이 머리말만 남는다. 설명은 각 대상의 note 칸에 적는다.
# 저장할 때마다 바로 이전 내용이 config.yaml.bak 에 남는다.
delay_seconds: 2
auto_check_hours: 6
max_age_months: 8
max_age_months_by_group:
  경희대: 3
max_pages: 25
summary:
  enabled: true
  model: claude-haiku-5-5
  per_run: 150
highlight:
  keywords:
  - 구조
  - BIM
  - OSC
  - 모듈러
  - 강구조
  - 철골
  - 접합
  - 탈현장
  - 프리캐스트
  - 자동화
  - 학부연구생
  - 연구생
  - T/O
  - T.O
  - 장학생 모집
  - 연구실탐방
  - 연구실 탐방
  - 대학원 모집
  - 모집요강
  - 신(편)입학
  - Modular
  - Steel
  - 構造
  - 鋼構造
  - 공모전
  - 경진대회
  - 해커톤
  - 부트캠프
  - 현장실습
  exclude:
  - 구조조정
  - 조직구조
  - 조직 구조
  - 인명구조
  - 구조대
  - 구조요청
  - 구조 요청
  - 가족구조
  alert:
  - 학부연구생
  - T/O
  - T.O
  - 모집요강
  - 연구실탐방
  - 연구실 탐방
  - 대학원 모집
  - 신(편)입학
  - 장학생 모집
  - 모듈러
  - 강구조
  - 철골
  - 募集要項
  - BIM AWARDS
  - 엔지니어링산업 경진대회
  - 스마트건설 챌린지
