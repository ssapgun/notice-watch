  category: 어학 · 영어 말하기
  status: 미정
  url: https://exam.toeic.co.kr
  note: 시험 일정은 확인하지 않았다. GPMU 스터디 일정에 맞춰 응시일을 정하면 추가. OPIc 과 둘 중 하나.
- name: CAPM (PMI)
  category: PM 자격
  status: 미정
  url: https://www.pmi.org/certifications/certified-associate-capm
  note: '요건: 고졸 이상·만 18세 이상·프로젝트관리 교육 23시간. 180분 150문항. GPMU 수강 시간이 23시간으로 인정되는지 확인할 것.'
